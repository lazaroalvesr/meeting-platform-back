services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting-platform-postgres
    environment:
      POSTGRES_DB: meeting_platform
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
