spring.application.name=meeting-platform

# PostgreSQL local, iniciado pelo Docker Compose.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O Hibernate apenas valida o banco; as tabelas serão criadas por migrations do Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=always
jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=7
app.cookie.secure=false
app.frontend-url=http://localhost:3000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
